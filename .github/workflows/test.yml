name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/Dreamsign.Tests/Dreamsign.Tests.csproj --locked-mode
      - run: dotnet test tests/Dreamsign.Tests/Dreamsign.Tests.csproj -c Release --no-restore --logger trx
      - run: dotnet publish src/Dreamsign.Server/Dreamsign.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o artifacts/server-only
      - uses: actions/upload-artifact@v4
        with:
          name: dreamsign-server-only-win-x64
          path: artifacts/server-only
